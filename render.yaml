# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render ("New +" -> "Blueprint") and it reads this
# file to create the service below. Vars marked `sync: false` are secrets
# Render will prompt for once during setup rather than storing here.
services:
  - type: web
    name: dhammahadaya-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # Runs migrate.js (idempotent — see scripts/migrate.js) before every
    # boot, so schema changes ship automatically with the code that needs
    # them, then starts the API.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/entries/post
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Matches what's actually running in production — Render blocks
      # outbound SMTP, which also blocks the OTP email this gates, so this
      # stays off until an operator deliberately re-enables it.
      - key: TWO_FACTOR_ENABLED
        value: "false"
      # smtp is kept configured below (unused while EMAIL_DRIVER=brevo) as a
      # fallback driver — see backend/src/email/. Render blocks outbound SMTP
      # ports (25/465/587), so smtp cannot actually send from this host;
      # brevo sends over HTTPS instead and is what production uses.
      - key: EMAIL_DRIVER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: dhammahadayasenasanaya@gmail.com
      - key: BREVO_FROM_NAME
        value: Dhammahadaya Senasanaya
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: RECAPTCHA_ENABLED
        value: "false"
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # Left off deliberately — Render's free tier sleeps the service when
      # idle, which can't keep a persistent WhatsApp session alive. The
      # sponsorship confirmation email always sends regardless of this.
      - key: WHATSAPP_ENABLED
        value: "false"
